name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: syntax + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          bash --version | head -1
          shellcheck --version | head -3

      - name: Bash syntax check
        run: bash -n ai-cli-setup.sh && echo ok

      - name: ShellCheck
        run: shellcheck -S warning ai-cli-setup.sh scripts/changelog.sh

      - name: Multibyte variable check (bash 3.2 compatibility)
        run: python3 scripts/check-multibyte-vars.py ai-cli-setup.sh scripts/changelog.sh

      - name: CHANGELOG is present and well-formed
        run: |
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md missing"; exit 1; }
          head -1 CHANGELOG.md | grep -qx '# Changelog' || { echo "::error::header wrong"; exit 1; }
          grep -q '^## \[' CHANGELOG.md || { echo "::error::no version sections"; exit 1; }
          echo OK

      - name: CHANGELOG freshness (warning only)
        run: |
          cp CHANGELOG.md /tmp/cl.before
          ./scripts/changelog.sh --all --update CHANGELOG.md
          if ! diff -q /tmp/cl.before CHANGELOG.md >/dev/null; then
            echo "::warning::CHANGELOG.md is stale - run ./scripts/changelog.sh --all --update CHANGELOG.md"
          fi
          cp /tmp/cl.before CHANGELOG.md

      - name: changelog.sh is idempotent
        run: |
          rm -f /tmp/CL.md
          ./scripts/changelog.sh --update /tmp/CL.md >/dev/null
          cp /tmp/CL.md /tmp/CL.1
          ./scripts/changelog.sh --update /tmp/CL.md >/dev/null
          diff /tmp/CL.1 /tmp/CL.md && echo idempotent

  smoke:
    name: smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Version / help / list / doctor
        run: |
          ./ai-cli-setup.sh --version
          ./ai-cli-setup.sh --help >/dev/null
          ./ai-cli-setup.sh list
          ./ai-cli-setup.sh doctor

      - name: Non-interactive full config write (isolated HOME)
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          ./ai-cli-setup.sh all -y --skip-install \
            --base-url https://gw.example.com/v1 \
            --api-key sk-test-123456 \
            --models gpt-5,gpt-5-mini
          test -f "$HOME/.pi/agent/models.json"
          test -f "$HOME/.pi/agent/settings.json"
          test -f "$HOME/.omo/agent/models.json"
          test -f "$HOME/.omp/agent/models.yml"
          test -f "$HOME/.omp/agent/config.yml"
          test -f "$HOME/.codex/config.toml"
          test -f "$HOME/.codex/auth.json"
          test -f "$HOME/.grok/config.toml"
          test -f "$HOME/.config/opencode/opencode.json"
          echo "all config files written"

      - name: Config contents + permissions
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export XDG_CONFIG_HOME="$HOME/.config"
          node -e '
            const base = process.env.HOME;
            const pi = require(base + "/.pi/agent/models.json");
            const p = Object.values(pi.providers)[0];
            if (p.baseUrl !== "https://gw.example.com/v1") throw new Error("pi baseUrl");
            if (p.apiKey !== "sk-test-123456") throw new Error("pi apiKey");
            if (p.models.length !== 2) throw new Error("pi models");
            const st = require(base + "/.pi/agent/settings.json");
            if (st.defaultModel !== "gpt-5") throw new Error("pi defaultModel: " + st.defaultModel);
            const st2 = require(base + "/.omo/agent/settings.json");
            if (st2.defaultModel !== "gpt-5") throw new Error("omo defaultModel");
            const oc = require(base + "/.config/opencode/opencode.json");
            const o = (oc.provider || oc.providers)["gw-example-com"];
            if (!o) throw new Error("opencode provider missing");
            const opts = o.options || o.settings;
            const key = opts.apiKey;
            if (key !== "sk-test-123456" && !/^\{env:/.test(key)) throw new Error("opencode key: " + key);
            if (oc.model !== "gw-example-com/gpt-5") throw new Error("opencode default: " + oc.model);
            console.log("config contents OK");
          '
          grep -q 'base_url = "https://gw.example.com"' "$HOME/.codex/config.toml"
          grep -q 'sk-test-123456' "$HOME/.codex/auth.json"
          grep -q 'api_key = "sk-test-123456"' "$HOME/.grok/config.toml"
          echo "codex/grok contents OK"
          # omp：models.yml 的 provider 块 + config.yml 的 modelRoles.default
          grep -q '^providers:$' "$HOME/.omp/agent/models.yml"
          grep -q '^  gw-example-com:$' "$HOME/.omp/agent/models.yml"
          grep -q 'baseUrl: "https://gw.example.com/v1"' "$HOME/.omp/agent/models.yml"
          grep -q 'apiKey: "sk-test-123456"' "$HOME/.omp/agent/models.yml"
          grep -q '^      - id: "gpt-5"$' "$HOME/.omp/agent/models.yml"
          grep -q '^  default: gw-example-com/gpt-5$' "$HOME/.omp/agent/config.yml"
          echo "omp contents OK"
          # 敏感文件权限必须是 600
          for f in "$HOME/.pi/agent/models.json" "$HOME/.omp/agent/models.yml" \
                   "$HOME/.omp/agent/config.yml" "$HOME/.grok/config.toml" \
                   "$HOME/.codex/auth.json" "$HOME/.config/opencode/opencode.json"; do
            perm="$(stat -c '%a' "$f" 2>/dev/null || stat -f '%Lp' "$f")"
            [ "$perm" = "600" ] || { echo "::error::$f has mode $perm, want 600"; exit 1; }
          done
          echo "permissions OK"

      - name: Interactive flow (language -> agents) via AICLI_ASSUME_TTY
        run: |
          export HOME="$RUNNER_TEMP/fakehome6"
          export XDG_CONFIG_HOME="$HOME/.config"
          export AICLI_ASSUME_TTY=1
          mkdir -p "$HOME"
          printf '2\n7\nhttps://gw.example.com/v1\nsk-ci-zh\nm1,m2\n' \
            | ./ai-cli-setup.sh --skip-install > /tmp/i1.out 2>&1 || {
              echo "::error::interactive run exited non-zero"; cat /tmp/i1.out; exit 1
            }
          grep -q '要安装哪些' /tmp/i1.out || { echo "::error::menu not shown"; cat /tmp/i1.out; exit 1; }
          grep -q '已选择：OpenCode' /tmp/i1.out || { echo "::error::selection wrong"; cat /tmp/i1.out; exit 1; }
          test -f "$HOME/.config/opencode/opencode.json" || { echo "::error::config not written"; cat /tmp/i1.out; exit 1; }
          echo "zh + single pick OK"

      - name: Menu retry + dry-run + guards
        run: |
          export HOME="$RUNNER_TEMP/fakehome7"
          export XDG_CONFIG_HOME="$HOME/.config"
          export AICLI_ASSUME_TTY=1
          mkdir -p "$HOME"
          printf '1\n9\nzz\n7\nhttps://gw.example.com/v1\nsk-x\nm1\n' \
            | ./ai-cli-setup.sh --skip-install > /tmp/i2.out 2>&1 || {
              echo "::error::retry run exited non-zero"; cat /tmp/i2.out; exit 1
            }
          grep -q 'invalid choice: 9' /tmp/i2.out || { echo "::error::retry not detected"; cat /tmp/i2.out; exit 1; }
          grep -q 'selected: OpenCode' /tmp/i2.out || { echo "::error::selection wrong"; cat /tmp/i2.out; exit 1; }
          # dry-run 不落盘
          ./ai-cli-setup.sh all -y --skip-install --dry-run \
            --base-url https://gw.example.com/v1 --api-key k --models a >/dev/null 2>&1
          [ ! -e "$HOME/.grok/config.toml" ] && echo "dry-run clean"
          # 缺凭据 / 未知 agent
          if ./ai-cli-setup.sh all -y --skip-install >/dev/null 2>&1; then echo "should fail"; exit 1; fi
          if ./ai-cli-setup.sh bogus >/dev/null 2>&1; then echo "should fail"; exit 1; fi
          echo "guards OK"

      - name: Merge preserves existing keys
        run: |
          export HOME="$RUNNER_TEMP/fakehome8"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          { "$schema": "x", "plugin": ["p1"], "provider": { "magpie": { "options": { "baseURL": "http://1/v1" } } } }
          JSON
          ./ai-cli-setup.sh opencode -y --skip-install \
            --base-url https://openrouter.ai/api/v1 --api-key sk-m --models anthropic/claude-opus-4.8
          node -e '
            const c = require(process.env.HOME + "/.config/opencode/opencode.json");
            if (JSON.stringify(c.plugin) !== JSON.stringify(["p1"])) throw new Error("plugin lost");
            if (!c.provider.magpie) throw new Error("provider lost");
            if (!c.provider.openrouter) throw new Error("openrouter missing");
            console.log("merge OK");
          '

      - name: omp merge preserves other providers and roles
        run: |
          export HOME="$RUNNER_TEMP/fakehome9"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME/.omp/agent"
          cat > "$HOME/.omp/agent/models.yml" <<'YML'
          providers:
            keepme:
              baseUrl: http://other/v1
              api: openai-completions
              apiKey: sk-keep
              models:
                - id: keep-model
          YML
          cat > "$HOME/.omp/agent/config.yml" <<'YML'
          theme:
            dark: titanium
          modelRoles:
            default: old/model
            smol: keep/smol
          YML
          ./ai-cli-setup.sh omp -y --skip-install \
            --base-url https://gw.example.com/v1 --api-key sk-omp --models gpt-5
          grep -q '^  keepme:$' "$HOME/.omp/agent/models.yml"
          grep -q 'apiKey: sk-keep' "$HOME/.omp/agent/models.yml"
          [ "$(grep -c '^  [A-Za-z0-9._-]*:$' "$HOME/.omp/agent/models.yml")" = "2" ] \
            || { echo "::error::provider block duplicated"; exit 1; }
          grep -q '^  default: gw-example-com/gpt-5$' "$HOME/.omp/agent/config.yml"
          grep -q '^  smol: keep/smol$' "$HOME/.omp/agent/config.yml"
          grep -q '^  dark: titanium$' "$HOME/.omp/agent/config.yml"
          echo "omp merge OK"

      - name: Install failure is reported as failure
        run: |
          # 造一个只有基础命令、没有 curl/wget/node/npm 的环境：pi 必须报 FAIL，
          # 且 claude（只写配置）仍应成功 —— 证明单个 agent 失败不会中断全局。
          SHIM="$RUNNER_TEMP/shim/bin"
          mkdir -p "$SHIM"
          for c in bash sh env sed grep cut tr mktemp date mkdir mv cp chmod printf uname id stty dirname head tail cat wc ln rm sleep python3; do
            p="$(type -P "$c" 2>/dev/null || command -v "$c" 2>/dev/null)" || continue
            case "$p" in /*) ln -sf "$p" "$SHIM/$c" ;; esac
          done
          export HOME="$RUNNER_TEMP/fakehome10"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          set +e
          PATH="$SHIM" "$SHIM/bash" ./ai-cli-setup.sh pi,claude -y \
            --base-url https://gw.example.com/v1 --api-key sk-x --models m1 > /tmp/fail.out 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "::error::run should exit non-zero when an agent fails"; cat /tmp/fail.out; exit 1; }
          grep -q 'install failed' /tmp/fail.out || { echo "::error::no FAIL in summary"; cat /tmp/fail.out; exit 1; }
          test -f "$HOME/.claude/settings.json" || { echo "::error::later agent was not configured"; exit 1; }
          echo "failure isolation OK"

      - name: dry-run writes nothing
        run: |
          export HOME="$RUNNER_TEMP/fakehome11"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          ./ai-cli-setup.sh all -y --skip-install --dry-run \
            --base-url https://gw.example.com/v1 --api-key k --models a >/dev/null 2>&1
          [ -z "$(find "$HOME" -type f | head -1)" ] || { echo "::error::dry-run created files"; find "$HOME" -type f; exit 1; }
          echo "dry-run clean"

      - name: Pipe mode (curl | bash style)
        run: |
          cat ai-cli-setup.sh | bash -s -- list >/dev/null && echo "pipe OK"

      - name: bash 3.2 compatibility (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash -n ai-cli-setup.sh && /bin/bash ./ai-cli-setup.sh --version
